# Reusable: publish a validated candidate, signed, or leave the published
# tag alone when nothing changed.
#
#   ghcr.io/<owner>/<repo>/<image>:sha-<commit>-p<run>   (build-image.yml)
#     → ghcr.io/<owner>/<image>:<tag>, same digest; the outgoing one as
#       :<tag>-prev, the rollback path
#
# Runs on the default branch only, after the stack's validators, in the
# same workflow run as the build: it promotes that run's recorded
# candidate digest and nothing else.  Without a candidate artifact (no
# build ran) the published tag stays as it is.
#
# Unchanged: when every architecture's rootless-stack.content label equals
# the published tag's and the published tag is signed, nothing is copied,
# so auto-updating hosts restart nothing.  `resign` (key rotation)
# overrides that.  Only this run's validated candidate is ever signed,
# never what the published tag points at now: re-signing that in place
# would bless a tag someone else moved, so an unsigned published tag is
# replaced by the candidate.
#
# Signing, twice, the index and every per-arch manifest, both logged in
# Rekor, the public transparency log:
# - keyless: the certificate names this workflow and the calling
#   repository; the reference for anyone verifying with cosign.
# - with the org key, in cosign's classic format (sha256-<digest>.sig tags
#   in the published repository), which podman checks at every pull
#   without cosign (base: containers/policy.json, which also requires the
#   Rekor entry, so a leaked key cannot sign unnoticed).
# The candidate is first copied to the staging tag :sha-<commit>-p<run> in
# the published repository and signed there; the published tag moves only
# afterwards, so it never points at an unsigned digest.  Signatures are by
# digest, so :<tag>, :<tag>-prev and the staging tag share them.
#
# Rollback: copy :<tag>-prev back over :<tag> (skopeo copy --all
# --preserve-digests); its signatures come along.
#
# Verify with cosign:
#   cosign verify ghcr.io/<owner>/<image>:<tag> \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     --certificate-identity https://github.com/<owner>/.github/.github/workflows/promote-image.yml@refs/heads/main \
#     --certificate-github-workflow-repository <owner>/<repo>
#
# Caller (after the stack's validators):
#   jobs:
#     promote:
#       needs: [build, validate]
#       uses: rootless-stack/.github/.github/workflows/promote-image.yml@main
#       with: {image: postfix, tag: alpine3.24}
#       secrets:
#         COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
#         COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
#       permissions: {contents: read, packages: write, id-token: write}
name: promote-image

on:
  workflow_call:
    inputs:
      image:
        type: string
        required: true
      tag:
        description: The published tag, e.g. alpine3.24
        type: string
        required: true
      resign:
        description: Promote and sign even an unchanged candidate (key rotation)
        type: boolean
        default: false
    secrets:
      COSIGN_PRIVATE_KEY:
        required: true
      COSIGN_PASSWORD:
        required: true
    outputs:
      digest:
        description: Digest the published tag points at afterwards
        value: ${{ jobs.promote.outputs.digest }}

permissions:
  contents: read

jobs:
  promote:
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
      # Keyless signing: GitHub's OIDC token gets the Fulcio certificate.
      id-token: write
    outputs:
      digest: ${{ steps.decide.outputs.published }}
    env:
      CANDIDATE: ghcr.io/${{ github.repository }}/${{ inputs.image }}
      PUBLISHED: ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}
      SHA_TAG: sha-${{ github.sha }}-p${{ github.run_id }}
      TAG: ${{ inputs.tag }}
      RESIGN: ${{ inputs.resign }}
      ARCHES: amd64 arm64
    steps:
      - id: artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: candidate-${{ inputs.image }}
          path: candidate
      - name: Log in
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$TOKEN" | skopeo login --username "$GITHUB_ACTOR" --password-stdin ghcr.io
      - id: decide
        name: Compare with the published tag
        run: |
          set -euo pipefail
          # Whether the index $1 and each of its per-arch manifests carries a
          # classic signature.  Presence only; the hosts verify the key.
          signed() {
            skopeo inspect --raw "docker://$1" > index.json || return 1
            for d in "sha256:$(sha256sum < index.json | cut -d' ' -f1)" \
                $(grep -o 'sha256:[0-9a-f]\{64\}' index.json); do
              skopeo inspect --raw "docker://${1%:*}:sha256-${d#sha256:}.sig" >/dev/null 2>&1 || return 1
            done
          }
          if [ ! -f candidate/candidate.digest ]; then
            echo "no candidate in this run — $PUBLISHED:$TAG not retagged" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "action=none" >> "$GITHUB_OUTPUT"; exit 0
          fi
          digest=$(cat candidate/candidate.digest)
          case "$digest" in *[!0-9a-f]*|'') echo "::error::invalid candidate digest artifact"; exit 1 ;; esac
          [ "${#digest}" -eq 64 ] || { echo "::error::invalid candidate digest length"; exit 1; }
          current=$(skopeo inspect --raw "docker://$CANDIDATE:$SHA_TAG" | sha256sum | cut -d' ' -f1)
          [ "$current" = "$digest" ] || { echo "::error::candidate tag changed after the manifest job"; exit 1; }
          candidate_ref="$CANDIDATE@sha256:$digest"
          # Unchanged while every arch carries the same content hash; an
          # unlabelled side never matches.
          unchanged=yes
          for arch in $ARCHES; do
            new=$(skopeo inspect --override-arch "$arch" --format '{{index .Labels "rootless-stack.content"}}' "docker://$candidate_ref")
            old=$(skopeo inspect --override-arch "$arch" --format '{{index .Labels "rootless-stack.content"}}' "docker://$PUBLISHED:$TAG" 2>/dev/null) || old=
            if [ -z "$new" ] || [ "$new" != "$old" ]; then unchanged=; fi
          done
          if [ -n "$unchanged" ] && [ "$RESIGN" != true ] && signed "$PUBLISHED:$TAG"; then
            published=$(skopeo inspect --raw "docker://$PUBLISHED:$TAG" | sha256sum | cut -d' ' -f1)
            echo "$candidate_ref has the content of $PUBLISHED:$TAG — not retagged, not signed" | tee -a "$GITHUB_STEP_SUMMARY"
            { echo "action=none"; echo "published=sha256:$published"; } >> "$GITHUB_OUTPUT"
          else
            { echo "action=promote"; echo "candidate=$candidate_ref"; echo "published=sha256:$digest"; } >> "$GITHUB_OUTPUT"
          fi
      - if: steps.decide.outputs.action == 'promote'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      # Before anything is staged or signed: decrypting the key proves the
      # secret is the key file's content and the password matches it.
      - name: Check the org key
        if: steps.decide.outputs.action == 'promote'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          # GitHub Free passes no organization secret to a private repository.
          [ -n "$COSIGN_PRIVATE_KEY" ] || {
            echo "::error::COSIGN_PRIVATE_KEY is empty: on GitHub Free, organization secrets reach public repositories only; make $GITHUB_REPOSITORY public or set the secrets on it"
            exit 1
          }
          cosign public-key --key env://COSIGN_PRIVATE_KEY >/dev/null || {
            echo "::error::COSIGN_PRIVATE_KEY/COSIGN_PASSWORD do not decrypt; set the key file's content: gh secret set COSIGN_PRIVATE_KEY --org $GITHUB_REPOSITORY_OWNER < <prefix>.private"
            exit 1
          }
      - name: Stage the candidate in the published repository
        if: steps.decide.outputs.action == 'promote'
        env:
          CANDIDATE_REF: ${{ steps.decide.outputs.candidate }}
        run: skopeo copy --all --preserve-digests "docker://$CANDIDATE_REF" "docker://$PUBLISHED:$SHA_TAG"
      - name: Sign keyless
        if: steps.decide.outputs.action == 'promote'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.decide.outputs.published }}
        run: |
          set -euo pipefail
          printf '%s' "$TOKEN" | cosign login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          cosign sign --yes --recursive "$PUBLISHED@$DIGEST"
      # Classic format and the Rekor v1 log: what podman's policy.json reads.
      - name: Sign with the org key
        if: steps.decide.outputs.action == 'promote'
        env:
          DIGEST: ${{ steps.decide.outputs.published }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          cosign sign --yes --recursive --key env://COSIGN_PRIVATE_KEY \
            --new-bundle-format=false --use-signing-config=false \
            "$PUBLISHED@$DIGEST"
      - name: Publish, keeping the outgoing tag as -prev
        if: steps.decide.outputs.action == 'promote'
        run: |
          set -euo pipefail
          signed() {
            skopeo inspect --raw "docker://$1" > index.json || return 1
            for d in "sha256:$(sha256sum < index.json | cut -d' ' -f1)" \
                $(grep -o 'sha256:[0-9a-f]\{64\}' index.json); do
              skopeo inspect --raw "docker://${1%:*}:sha256-${d#sha256:}.sig" >/dev/null 2>&1 || return 1
            done
          }
          # A signature only on the index would pass the copy and fail every
          # host pull of a per-arch image.
          signed "$PUBLISHED:$SHA_TAG" || { echo "::error::index or per-arch manifest has no signature"; exit 1; }
          if skopeo inspect --no-tags "docker://$PUBLISHED:$TAG" >/dev/null 2>&1; then
            echo "keeping outgoing $PUBLISHED:$TAG as $TAG-prev"
            skopeo copy --all --preserve-digests "docker://$PUBLISHED:$TAG" "docker://$PUBLISHED:$TAG-prev"
          fi
          skopeo copy --all --preserve-digests "docker://$PUBLISHED:$SHA_TAG" "docker://$PUBLISHED:$TAG"
          signed "$PUBLISHED:$TAG" || { echo "::error::$PUBLISHED:$TAG is not fully signed"; exit 1; }
          echo "published $PUBLISHED:$TAG ($(skopeo inspect --format '{{.Digest}}' "docker://$PUBLISHED:$TAG"))" | tee -a "$GITHUB_STEP_SUMMARY"
      # Hosts pull anonymously.  GitHub creates every package private and
      # offers no API to change that: the web UI does, once per package and
      # for good.  Candidates (ghcr.io/<owner>/<repo>/<image>) stay private.
      - name: Check that hosts can pull it
        if: steps.decide.outputs.published != ''
        run: |
          skopeo inspect --no-creds --raw "docker://$PUBLISHED:$TAG" >/dev/null 2>&1 ||
            echo "::warning::$PUBLISHED is private, hosts cannot pull it: make it public once at https://github.com/orgs/$GITHUB_REPOSITORY_OWNER/packages/container/package/${PUBLISHED##*/} (Package settings, Change visibility)" | tee -a "$GITHUB_STEP_SUMMARY"
